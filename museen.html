<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Museum Wolfenbüttel – Museum auswählen</title>

<style>

:root{

  --bg-main:#f4f0e8;
  --bg-light:#fbfaf7;

  --text:#292622;
  --muted:#817a70;

  --wine:#742b40;
  --wine-top:#884058;
  --wine-dark:#511928;

  /* Bildschirm-Annäherung an RAL 6005 */
  --green:#0f4336;
  --green-top:#1c5d4c;
  --green-dark:#082c23;

  --gold:#b59a68;
  --gold-soft:rgba(181,154,104,.38);

  --shadow:rgba(55,42,31,.17);
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
}

body{

  min-height:100vh;

  font-family:
    "Segoe UI",
    "Helvetica Neue",
    Arial,
    sans-serif;

  color:var(--text);

  background:

    radial-gradient(
      circle at 18% 12%,
      rgba(255,255,255,.95),
      transparent 35%
    ),

    radial-gradient(
      circle at 85% 85%,
      rgba(116,43,64,.04),
      transparent 32%
    ),

    linear-gradient(
      145deg,
      #ebe5da 0%,
      var(--bg-light) 48%,
      #eee8de 100%
    );

  overflow-x:hidden;
}


/* ÄUSSERER MUSEUMSRAHMEN */

.frame-outer{

  position:fixed;

  top:18px;
  left:18px;
  right:18px;
  bottom:18px;

  border:
    1px solid rgba(121,101,72,.20);

  border-radius:20px;

  pointer-events:none;

  z-index:20;
}


/* ZWEITE FEINE LINIE */

.frame-inner{

  position:fixed;

  top:27px;
  left:27px;
  right:27px;
  bottom:27px;

  border:
    1px solid rgba(181,154,104,.16);

  border-radius:15px;

  pointer-events:none;

  z-index:20;
}


/* SEITE */

.page{

  min-height:100vh;

  max-width:1180px;

  margin:0 auto;

  padding:
    80px
    55px
    58px;

  display:flex;

  flex-direction:column;

  align-items:center;
}


/* KOPF */

header{

  width:100%;

  text-align:center;

  margin-bottom:70px;
}

.eyebrow{

  color:var(--wine);

  font-size:13px;

  font-weight:700;

  letter-spacing:3px;

  text-transform:uppercase;

  margin-bottom:18px;
}

h1{

  margin:0;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:44px;

  line-height:1.15;

  font-weight:500;

  letter-spacing:-.4px;

  color:#2d2925;
}


/* KLEINE GOLDENE LINIE */

.ornament{

  width:82px;

  height:2px;

  margin:
    25px auto 0;

  border-radius:2px;

  background:
    linear-gradient(
      90deg,
      transparent,
      var(--gold),
      transparent
    );
}


/* MUSEUM-KARTEN */

.museums{

  width:100%;

  max-width:900px;

  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:42px;

  align-items:center;
}


.museum{

  position:relative;

  width:100%;

  height:250px;

  border:none;

  border-radius:38px;

  overflow:hidden;

  cursor:pointer;

  color:white;

  display:flex;

  align-items:center;

  justify-content:center;

  text-align:center;

  padding:30px;

  transition:
    transform .18s ease,
    box-shadow .18s ease,
    filter .18s ease;
}


/* SANFTER GLANZ */

.museum::before{

  content:"";

  position:absolute;

  inset:0;

  background:

    radial-gradient(
      circle at 18% 12%,
      rgba(255,255,255,.28),
      transparent 32%
    ),

    linear-gradient(
      145deg,
      rgba(255,255,255,.10),
      transparent 42%,
      rgba(0,0,0,.08)
    );

  pointer-events:none;
}


/* FEINER INNENRAHMEN */

.museum::after{

  content:"";

  position:absolute;

  inset:10px;

  border:
    1px solid rgba(255,255,255,.17);

  border-radius:29px;

  pointer-events:none;
}


/* SCHLOSS */

.schloss{

  background:
    linear-gradient(
      145deg,
      var(--wine-top),
      var(--wine) 55%,
      #642237
    );

  box-shadow:

    0 12px 0 var(--wine-dark),

    0 26px 48px
    rgba(99,31,51,.24),

    inset 0 2px 2px
    rgba(255,255,255,.16);
}


/* BÜRGER */

.buerger{

  background:
    linear-gradient(
      145deg,
      var(--green-top),
      var(--green) 55%,
      #0c392e
    );

  box-shadow:

    0 12px 0 var(--green-dark),

    0 26px 48px
    rgba(12,60,48,.24),

    inset 0 2px 2px
    rgba(255,255,255,.16);
}


/* TEXT AUF DEN KARTEN */

.museum-name{

  position:relative;

  z-index:2;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:30px;

  font-weight:500;

  letter-spacing:.2px;

  text-shadow:
    0 2px 7px
    rgba(0,0,0,.15);
}


/* HOVER */

.museum:hover{

  transform:
    translateY(-5px)
    scale(1.012);

  filter:brightness(1.035);
}


/* DRUCKEFFEKT */

.museum:active{

  transform:
    translateY(7px)
    scale(.995);
}


.schloss:active{

  box-shadow:

    0 4px 0 var(--wine-dark),

    0 12px 22px
    rgba(99,31,51,.19);
}


.buerger:active{

  box-shadow:

    0 4px 0 var(--green-dark),

    0 12px 22px
    rgba(12,60,48,.19);
}


/* ZURÜCK */

.back-area{

  margin-top:72px;

  display:flex;

  justify-content:center;
}


.back-button{

  min-width:170px;

  height:54px;

  border:

    1px solid
    rgba(108,91,70,.18);

  border-radius:18px;

  padding:0 30px;

  background:

    linear-gradient(
      180deg,
      #ffffff,
      #ece7de
    );

  color:#514b44;

  font-size:15px;

  font-weight:650;

  cursor:pointer;

  box-shadow:

    0 6px 0
    #d3ccc0,

    0 12px 24px
    rgba(63,48,34,.12),

    inset 0 1px 1px
    rgba(255,255,255,.9);

  transition:
    transform .13s ease,
    box-shadow .13s ease,
    background .13s ease;
}


.back-button:hover{

  background:

    linear-gradient(
      180deg,
      #ffffff,
      #f2eee7
    );

  transform:
    translateY(-2px);
}


.back-button:active{

  transform:
    translateY(5px);

  box-shadow:

    0 1px 0
    #d3ccc0,

    0 5px 10px
    rgba(63,48,34,.10);
}


/* KLEINE FUSSZEILE */

.footer{

  margin-top:auto;

  padding-top:45px;

  color:#aaa297;

  font-size:11px;

  letter-spacing:.4px;

  text-align:center;
}


/* MOBILE */

@media(max-width:760px){

  .page{

    padding:
      58px
      30px
      40px;
  }

  header{

    margin-bottom:45px;
  }

  h1{

    font-size:34px;
  }

  .museums{

    grid-template-columns:1fr;

    gap:30px;
  }

  .museum{

    height:190px;

    border-radius:31px;
  }

  .museum::after{

    border-radius:23px;
  }

  .museum-name{

    font-size:27px;
  }

  .back-area{

    margin-top:50px;
  }

  .frame-outer{

    top:9px;
    left:9px;
    right:9px;
    bottom:9px;
  }

  .frame-inner{

    top:16px;
    left:16px;
    right:16px;
    bottom:16px;
  }
}

</style>
</head>


<body>


<div class="frame-outer"></div>
<div class="frame-inner"></div>


<main class="page">


<header>

  <div class="eyebrow">
    Museum Wolfenbüttel
  </div>

  <h1>
    Bitte wählen Sie eines der Museen aus
  </h1>

  <div class="ornament"></div>

</header>



<section class="museums">


  <button
    class="museum schloss"
    onclick="location.href='schloss.html'">

    <div class="museum-name">
      Schloss Museum
    </div>

  </button>


  <button
    class="museum buerger"
    onclick="location.href='buerger-vitrine.html'">

    <div class="museum-name">
      Bürger Museum
    </div>

  </button>


</section>



<div class="back-area">

  <button
    class="back-button"
    onclick="goBack()">

    Zurück

  </button>

</div>



<div class="footer">

  Ausstellungssteuerung · Museum Wolfenbüttel

</div>


</main>



<script>

if(
  !sessionStorage.getItem(
    "museumPanelPin"
  )
){
  location.href =
    "index.html";
}


function goBack(){

  sessionStorage.removeItem(
    "museumPanelPin"
  );

  location.href =
    "index.html";
}

</script>


</body>
</html>
