<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Museum Wolfenbüttel – Museum wählen</title>

<style>
:root{
  --bg1:#eee9df;
  --bg2:#faf8f3;

  --wine:#6b2637;
  --wine-dark:#4d1725;

  /* Bildschirm-Annäherung an RAL 6005 */
  --green:#0f4336;
  --green-dark:#082d24;

  --text:#262626;
  --muted:#7b766f;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:"Segoe UI",Arial,sans-serif;
  background:
    radial-gradient(circle at 50% 0%,rgba(255,255,255,.95),transparent 38%),
    linear-gradient(145deg,var(--bg1),var(--bg2));
  color:var(--text);
}

.wrap{
  min-height:100vh;
  max-width:1100px;
  margin:auto;
  padding:50px 30px;
  display:flex;
  flex-direction:column;
}

header{
  text-align:center;
  margin-bottom:65px;
}

h1{
  margin:0;
  font-size:34px;
  font-weight:650;
  letter-spacing:-.6px;
}

.subtitle{
  color:var(--muted);
  margin-top:10px;
  font-size:16px;
}

.museums{
  flex:1;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:38px;
  align-items:center;
}

.museum{
  position:relative;
  min-height:260px;
  border:0;
  border-radius:28px;
  padding:34px;
  color:white;
  cursor:pointer;
  text-align:left;
  overflow:hidden;
  transition:
    transform .16s ease,
    box-shadow .16s ease;
}

.museum::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.22),
      transparent 35%,
      rgba(0,0,0,.10)
    );
  pointer-events:none;
}

.schloss{
  background:linear-gradient(145deg,#7b3043,var(--wine));
  box-shadow:
    0 12px 0 var(--wine-dark),
    0 26px 42px rgba(92,29,45,.24);
}

.buerger{
  background:linear-gradient(145deg,#175745,var(--green));
  box-shadow:
    0 12px 0 var(--green-dark),
    0 26px 42px rgba(14,67,54,.23);
}

.museum:hover{
  transform:translateY(-4px);
}

.museum:active{
  transform:translateY(7px);
}

.schloss:active{
  box-shadow:
    0 5px 0 var(--wine-dark),
    0 12px 24px rgba(92,29,45,.20);
}

.buerger:active{
  box-shadow:
    0 5px 0 var(--green-dark),
    0 12px 24px rgba(14,67,54,.20);
}

.museum-name{
  position:relative;
  z-index:1;
  font-size:31px;
  font-weight:700;
  margin-bottom:9px;
}

.museum-sub{
  position:relative;
  z-index:1;
  opacity:.82;
  font-size:15px;
}

.arrow{
  position:absolute;
  right:30px;
  bottom:25px;
  font-size:30px;
  opacity:.9;
}

.logout{
  margin-top:55px;
  text-align:center;
}

.logout button{
  border:1px solid #d8d2ca;
  background:rgba(255,255,255,.7);
  color:#605b55;
  border-radius:12px;
  padding:10px 18px;
  cursor:pointer;
}

@media(max-width:720px){
  .museums{
    grid-template-columns:1fr;
    gap:28px;
  }

  .museum{
    min-height:190px;
  }

  header{
    margin-bottom:35px;
  }
}
</style>
</head>

<body>

<div class="wrap">

<header>
  <h1>Museum auswählen</h1>
  <div class="subtitle">
    Bitte wählen Sie den gewünschten Bereich.
  </div>
</header>

<div class="museums">

  <button
    class="museum schloss"
    onclick="location.href='schloss.html'">

    <div class="museum-name">
      Schloss Museum
    </div>

    <div class="museum-sub">
      Ausstellungen und Steuerung
    </div>

    <div class="arrow">›</div>
  </button>


  <button
    class="museum buerger"
    onclick="location.href='buerger-vitrine.html'">

    <div class="museum-name">
      Bürger Museum
    </div>

    <div class="museum-sub">
      Ausstellungen und Steuerung
    </div>

    <div class="arrow">›</div>
  </button>

</div>

<div class="logout">
  <button onclick="logout()">Abmelden</button>
</div>

</div>

<script>

if(!sessionStorage.getItem("museumPanelPin")){
  location.href="index.html";
}

function logout(){
  sessionStorage.removeItem("museumPanelPin");
  location.href="index.html";
}

</script>

</body>
</html>
