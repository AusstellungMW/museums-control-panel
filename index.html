<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Museum Wolfenbüttel – Kontrollpanel</title>

<style>
:root{
  --bg1:#eee9df;
  --bg2:#faf8f3;
  --text:#252525;
  --muted:#77736d;
  --wine:#6b2637;
  --wine-dark:#501927;
  --border:rgba(80,70,55,.14);
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:"Segoe UI",Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 20% 15%,rgba(255,255,255,.9),transparent 34%),
    linear-gradient(145deg,var(--bg1),var(--bg2));
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.login-card{
  width:min(520px,100%);
  background:rgba(255,255,255,.88);
  border:1px solid var(--border);
  border-radius:28px;
  padding:48px 42px 40px;
  box-shadow:
    0 30px 70px rgba(56,43,32,.16),
    0 3px 8px rgba(56,43,32,.08),
    inset 0 1px 0 rgba(255,255,255,.9);
  backdrop-filter:blur(10px);
  text-align:center;
}

.symbol{
  width:68px;
  height:68px;
  margin:0 auto 24px;
  border-radius:50%;
  background:linear-gradient(145deg,#7d3244,#571c2b);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:28px;
  box-shadow:
    0 12px 24px rgba(107,38,55,.26),
    inset 0 1px 1px rgba(255,255,255,.25);
}

h1{
  font-size:30px;
  font-weight:650;
  margin:0 0 10px;
  letter-spacing:-.5px;
}

.subtitle{
  color:var(--muted);
  font-size:16px;
  line-height:1.5;
  margin-bottom:34px;
}

.pin-wrap{
  display:flex;
  gap:12px;
}

input{
  flex:1;
  min-width:0;
  border:1px solid #d8d2c8;
  border-radius:15px;
  padding:15px 17px;
  font-size:18px;
  letter-spacing:3px;
  outline:none;
  background:#fff;
  box-shadow:inset 0 2px 5px rgba(50,40,30,.05);
}

input:focus{
  border-color:#9b6a75;
  box-shadow:
    0 0 0 4px rgba(107,38,55,.09),
    inset 0 2px 5px rgba(50,40,30,.04);
}

button{
  border:0;
  border-radius:15px;
  padding:15px 22px;
  font-size:15px;
  font-weight:700;
  color:white;
  cursor:pointer;
  background:linear-gradient(180deg,#7b3042,#612031);
  box-shadow:
    0 7px 0 var(--wine-dark),
    0 12px 22px rgba(107,38,55,.22);
  transition:.12s ease;
}

button:hover{
  transform:translateY(-1px);
}

button:active{
  transform:translateY(5px);
  box-shadow:
    0 2px 0 var(--wine-dark),
    0 6px 12px rgba(107,38,55,.18);
}

button:disabled{
  opacity:.6;
  cursor:default;
}

.message{
  min-height:24px;
  margin-top:24px;
  font-size:14px;
  color:var(--muted);
}

.message.error{
  color:#9a3333;
}

.footer{
  margin-top:30px;
  color:#aaa49b;
  font-size:12px;
}

@media(max-width:560px){
  .login-card{padding:36px 24px 30px}
  .pin-wrap{flex-direction:column}
  button{width:100%}
  h1{font-size:26px}
}
</style>
</head>

<body>

<div class="login-card">

  <div class="symbol">M</div>

  <h1>Willkommen im Kontrollpanel</h1>

  <div class="subtitle">
    Museum Wolfenbüttel<br>
    Bitte geben Sie Ihre PIN ein.
  </div>

  <div class="pin-wrap">
    <input
      id="pin"
      type="password"
      inputmode="numeric"
      autocomplete="off"
      placeholder="PIN"
      onkeydown="if(event.key==='Enter') login()"
    >

    <button id="loginBtn" onclick="login()">
      Weiter
    </button>
  </div>

  <div class="message" id="message"></div>

  <div class="footer">
    Ausstellungssteuerung · Museum Wolfenbüttel
  </div>

</div>

<script>
const WORKER="https://museum-shelly-bridge.feaga11.workers.dev";

async function login(){

  const pin=document.getElementById("pin").value.trim();
  const msg=document.getElementById("message");
  const btn=document.getElementById("loginBtn");

  if(!pin){
    msg.textContent="Bitte PIN eingeben.";
    msg.className="message error";
    return;
  }

  btn.disabled=true;
  msg.textContent="Zugang wird geprüft …";
  msg.className="message";

  try{

    const response=await fetch(WORKER+"/api/status",{
      headers:{
        "X-Panel-Pin":pin
      },
      cache:"no-store"
    });

    if(response.status===401){
      throw new Error("Die eingegebene PIN ist nicht korrekt.");
    }

    if(!response.ok){
      throw new Error("Verbindung konnte nicht hergestellt werden.");
    }

    sessionStorage.setItem("museumPanelPin",pin);

    msg.textContent="Zugang bestätigt.";
    
    setTimeout(()=>{
      window.location.href="museen.html";
    },350);

  }catch(error){

    msg.textContent=error.message;
    msg.className="message error";
    btn.disabled=false;

  }
}
</script>

</body>
</html>
