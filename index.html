<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Museum Wolfenbüttel – Kontrollpanel</title>

<style>
:root{
  --bg:#f3efe7;
  --bg-light:#fbfaf7;
  --card:rgba(255,255,255,.94);

  --text:#252321;
  --muted:#817b73;

  --wine:#72283d;
  --wine-light:#8b3b52;
  --wine-dark:#511829;

  --gold:#b89b68;

  --border:rgba(86,72,55,.14);
  --shadow:rgba(63,49,37,.18);
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
}

body{
  min-height:100vh;
  font-family:
    "Segoe UI",
    "Helvetica Neue",
    Arial,
    sans-serif;

  color:var(--text);

  background:
    radial-gradient(
      circle at 18% 15%,
      rgba(255,255,255,.98) 0,
      rgba(255,255,255,.56) 19%,
      transparent 42%
    ),
    radial-gradient(
      circle at 82% 85%,
      rgba(114,40,61,.045) 0,
      transparent 34%
    ),
    linear-gradient(
      145deg,
      #ebe5da 0%,
      var(--bg-light) 48%,
      #eee9e1 100%
    );

  display:flex;
  align-items:center;
  justify-content:center;
  padding:32px;
}

/* dezente Museumsrahmen am Bildschirmrand */
body::before{
  content:"";
  position:fixed;
  inset:18px;
  border:1px solid rgba(92,75,55,.07);
  pointer-events:none;
}

.login-card{
  position:relative;

  width:min(620px,100%);

  background:var(--card);

  border:
    1px solid rgba(101,83,63,.13);

  border-radius:30px;

  padding:
    58px 56px 46px;

  text-align:center;

  box-shadow:
    0 34px 90px var(--shadow),
    0 8px 24px rgba(56,42,30,.08),
    inset 0 1px 0 rgba(255,255,255,.95);

  backdrop-filter:blur(12px);

  overflow:hidden;
}

/* feine Weinrot-Linie oben */
.login-card::before{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:0;
  height:5px;

  background:
    linear-gradient(
      90deg,
      var(--wine-dark),
      var(--wine-light),
      var(--wine-dark)
    );
}

.museum-name{
  margin-bottom:22px;

  color:var(--wine);

  font-size:14px;
  font-weight:700;

  letter-spacing:2.7px;
  text-transform:uppercase;
}

.emblem{
  width:82px;
  height:82px;

  margin:
    0 auto 26px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  position:relative;

  color:#fff;

  font-family:Georgia,serif;
  font-size:27px;

  background:
    linear-gradient(
      145deg,
      #8a3b51,
      #672238 60%,
      #501627
    );

  border:
    1px solid rgba(255,255,255,.3);

  box-shadow:
    0 13px 28px rgba(105,32,53,.28),
    inset 0 2px 2px rgba(255,255,255,.24),
    inset 0 -3px 6px rgba(0,0,0,.15);
}

.emblem::after{
  content:"";
  position:absolute;
  inset:7px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.25);
}

h1{
  margin:
    0 0 13px;

  font-size:34px;
  line-height:1.15;

  font-weight:650;

  letter-spacing:-.7px;
}

.intro{
  max-width:430px;

  margin:
    0 auto 36px;

  color:var(--muted);

  font-size:16px;
  line-height:1.65;
}

.divider{
  width:64px;
  height:2px;

  margin:
    0 auto 34px;

  border-radius:2px;

  background:
    linear-gradient(
      90deg,
      transparent,
      var(--gold),
      transparent
    );
}

.pin-title{
  margin-bottom:12px;

  font-size:14px;
  font-weight:650;

  color:#5c5751;

  text-align:left;
}

.pin-row{
  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    132px;

  gap:12px;

  width:100%;
}

.pin-input{
  width:100%;
  height:56px;

  border:
    1px solid #d7d0c6;

  border-radius:15px;

  padding:
    0 18px;

  outline:none;

  background:#fff;

  color:var(--text);

  font-size:19px;
  letter-spacing:4px;

  box-shadow:
    inset 0 2px 5px rgba(48,38,28,.045),
    0 2px 5px rgba(50,40,30,.025);

  transition:
    border-color .16s ease,
    box-shadow .16s ease;
}

.pin-input:focus{
  border-color:
    rgba(114,40,61,.7);

  box-shadow:
    0 0 0 4px rgba(114,40,61,.09),
    inset 0 2px 5px rgba(48,38,28,.04);
}

.continue-button{
  width:132px;
  height:56px;

  border:0;
  border-radius:15px;

  padding:0;

  font-size:15px;
  font-weight:700;

  color:white;

  cursor:pointer;

  background:
    linear-gradient(
      180deg,
      #8b4055 0%,
      #71283d 58%,
      #632034 100%
    );

  box-shadow:
    0 6px 0 var(--wine-dark),
    0 11px 20px rgba(100,32,53,.22),
    inset 0 1px 1px rgba(255,255,255,.28);

  transition:
    transform .12s ease,
    box-shadow .12s ease,
    filter .12s ease;
}

.continue-button:hover{
  filter:brightness(1.06);
  transform:translateY(-1px);
}

.continue-button:active{
  transform:translateY(5px);

  box-shadow:
    0 1px 0 var(--wine-dark),
    0 5px 10px rgba(100,32,53,.18),
    inset 0 1px 1px rgba(255,255,255,.2);
}

.continue-button:disabled{
  opacity:.62;
  cursor:default;
  transform:none;
}

.message{
  display:flex;
  align-items:center;
  justify-content:center;

  min-height:25px;

  margin-top:26px;

  color:var(--muted);

  font-size:14px;
}

.message.error{
  color:#9b3434;
}

.message.success{
  color:#3e7456;
}

.footer{
  margin-top:34px;

  padding-top:22px;

  border-top:
    1px solid rgba(96,82,64,.09);

  color:#a39c93;

  font-size:12px;

  letter-spacing:.2px;
}

@media(max-width:600px){

  body{
    padding:18px;
  }

  body::before{
    inset:8px;
  }

  .login-card{
    padding:
      42px 25px 32px;

    border-radius:24px;
  }

  .museum-name{
    font-size:12px;
    letter-spacing:2.2px;
  }

  .emblem{
    width:72px;
    height:72px;
  }

  h1{
    font-size:28px;
  }

  .intro{
    font-size:15px;
  }

  .pin-row{
    grid-template-columns:1fr;
  }

  .continue-button{
    width:100%;
  }
}
</style>
</head>

<body>

<main class="login-card">

  <div class="museum-name">
    Museum Wolfenbüttel
  </div>

  <div class="emblem">
    MW
  </div>

  <h1>
    Willkommen im Kontrollpanel
  </h1>

  <div class="intro">
    Zentrale Steuerung der Ausstellungsbereiche
    von Schloss Museum und Bürger Museum.
  </div>

  <div class="divider"></div>

  <div class="pin-title">
    Bitte geben Sie Ihre PIN ein
  </div>

  <div class="pin-row">

    <input
      class="pin-input"
      id="pin"
      type="password"
      inputmode="numeric"
      autocomplete="off"
      placeholder="PIN"
      aria-label="PIN"
      onkeydown="if(event.key==='Enter') login()"
    >

    <button
      class="continue-button"
      id="loginBtn"
      onclick="login()"
    >
      Weiter
    </button>

  </div>

  <div
    class="message"
    id="message">
  </div>

  <div class="footer">
    Ausstellungssteuerung · Museum Wolfenbüttel
  </div>

</main>

<script>

const WORKER =
  "https://museum-shelly-bridge.feaga11.workers.dev";

async function login(){

  const pin =
    document.getElementById("pin").value.trim();

  const msg =
    document.getElementById("message");

  const btn =
    document.getElementById("loginBtn");

  if(!pin){

    msg.textContent =
      "Bitte PIN eingeben.";

    msg.className =
      "message error";

    return;
  }

  btn.disabled = true;

  msg.textContent =
    "Zugang wird geprüft …";

  msg.className =
    "message";

  try{

    const response =
      await fetch(
        WORKER + "/api/status",
        {
          headers:{
            "X-Panel-Pin":pin
          },
          cache:"no-store"
        }
      );

    if(response.status === 401){

      throw new Error(
        "Die eingegebene PIN ist nicht korrekt."
      );
    }

    if(!response.ok){

      throw new Error(
        "Verbindung konnte nicht hergestellt werden."
      );
    }

    sessionStorage.setItem(
      "museumPanelPin",
      pin
    );

    msg.textContent =
      "Zugang bestätigt.";

    msg.className =
      "message success";

    setTimeout(
      ()=>{
        window.location.href =
          "museen.html";
      },
      450
    );

  }
  catch(error){

    msg.textContent =
      error.message;

    msg.className =
      "message error";

    btn.disabled = false;
  }
}

</script>

</body>
</html>
